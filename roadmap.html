<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Meme University Roadmap — Explore all 13 phases of the AI learning curriculum from foundations to deployment.">
    <title>Roadmap — AI Meme University</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
</head>
<body>
    <div class="app-layout">
        <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

        <aside class="sidebar" id="sidebar" role="navigation" aria-label="Course navigation">
            <div class="sidebar-header">
                <a href="index.html" class="sidebar-logo" aria-label="AI Meme University Home">
                    <span class="logo-icon">🧠</span>
                    <span>AI Meme U</span>
                </a>
                <button class="sidebar-close" id="sidebarClose" aria-label="Close sidebar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <nav class="sidebar-nav" id="sidebarNav"></nav>
            <div class="sidebar-footer">
                <div class="sidebar-progress">
                    <div class="sidebar-progress-label">
                        <span>Overall Progress</span>
                        <span id="sidebarProgressPercent">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-bar-fill" id="sidebarProgressBar" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </aside>

        <div class="main-content" id="mainContent">
            <nav class="navbar" id="navbar" role="navigation" aria-label="Main navigation">
                <div class="navbar-left">
                    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open navigation menu">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                    </button>
                    <div class="nav-links">
                        <a href="index.html" class="nav-link">Home</a>
                        <a href="roadmap.html" class="nav-link active">Roadmap</a>
                        <a href="about.html" class="nav-link">About</a>
                    </div>
                </div>
                <div class="navbar-right">
                    <div class="search-container" id="searchContainer">
                        <div class="search-input-wrapper">
                            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            <input type="search" class="search-input" id="searchInput" placeholder="Search lessons..." aria-label="Search lessons" autocomplete="off">
                        </div>
                        <div class="search-results" id="searchResults" role="listbox" aria-label="Search results"></div>
                    </div>
                </div>
            </nav>

            <section class="content-wrapper">
                <div class="section-header">
                    <h1 style="font-size: var(--text-3xl); font-weight: 800; letter-spacing: -0.03em;">🗺️ Learning Roadmap</h1>
                    <p>Your complete path from AI foundations to production deployment</p>
                </div>

                <div class="roadmap-grid" id="roadmapGrid">
                    <!-- Populated by app.js -->
                </div>
            </section>
        </div>
    </div>

    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <script src="js/curriculum.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/search.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
